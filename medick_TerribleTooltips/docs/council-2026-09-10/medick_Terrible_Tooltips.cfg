[medick_Terrible_Tooltips]
# Master on/off for WoW-style tier/grade tooltip colours
EnableTooltips = true
# Show tier+grade letters on items lying on the ground
GroundLabels = "FilterOnly"
# Colour affix names by their crafting tier (T1 gray → T7 mythic)
TooltipTierColors = true
# Colour grade letters by roll quality (F gray → S mythic)
TooltipRankColors = true
# What to show on items on the ground (None / TierAndRank / TierOnly / RankOnly)
GroundLabelStyle = "TierAndRank"
# Only show ground labels on loot-filter highlighted items
GroundLabelFilterOnly = true
# Hide ground brackets until you hold Alt (KG-style)
GroundLabelAltKey = true
# Show the matched loot filter rule number inside the item tooltip on hover
ShowFilterRuleNumber = "NumberOnly"
# Where to place EHG's filter rule number on the ground label (Start / End / EHGDefault)
LabelRulePosition = "EHGDefault"
DebugLog = false
# Where the Tier·Grade signal sits on each affix line (BadgeLeft / SignalRight / Trailing)
TooltipLayout = "BadgeLeft"
# TierColor = affix text wears its tier color; GameDefault = game's own text color
AffixNameColor = "TierColor"
# The S/A/B/C/F roll grade on each affix line
ShowGradeLetters = true
# Pin EHG's 'Range: X to Y' lines permanently (default: hidden, hold Alt to peek)
AlwaysShowRanges = true
# Pin EHG's full 'Tier: N (max craftable)' line (default: folded into the clean line, hold Alt to peek)
AlwaysShowTierDetails = true
# Badge = Tier/Grade as colored chips (label look); PlainText = colored text only
SignalStyle = "Badge"
# Spelled = 'Tier 5' plus its grade; Compact = '5' plus its grade; Fused = one honest two-color '5A' token
SignalText = "Spelled"

